# Only needed when running the API/workers directly on the host.
# Use with the main Compose file to publish optional host-development ports.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_DEV_PORT:-15432}:5432"
  redis:
    ports:
      - "127.0.0.1:${REDIS_DEV_PORT:-16379}:6379"
  clamav:
    ports:
      - "127.0.0.1:${CLAMAV_DEV_PORT:-13310}:3310"
