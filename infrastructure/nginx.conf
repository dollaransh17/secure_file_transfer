server {
    listen 80;
    server_tokens off;
    client_max_body_size 26m;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
    location /api/ { proxy_pass http://${API_UPSTREAM}; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 120s; }
    location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
