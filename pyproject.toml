[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "prooflane"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20", "argon2-cffi>=23.1", "boto3>=1.36,<2", "redis>=5,<7", "anthropic>=0.49,<1", "rank-bm25>=0.2.2"]
[project.optional-dependencies]
research = ["torch>=2.6,<3", "torch-geometric>=2.6,<3", "lightgbm>=4.6,<5", "numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "pillow>=11", "reportlab>=4"]
test = ["pytest>=8", "httpx>=0.28"]
[tool.setuptools.packages.find]
where = ["apps/api"]
[tool.pytest.ini_options]
pythonpath = ["apps/api", "."]
testpaths = ["tests"]
